<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Образовательная платформа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
  <link rel="stylesheet" href="style.css?v=40">
</head>
<body>
  <div class="app-container">
    <header class="controls-header">
      <div class="selector-row">
        <div class="dropdown-wrapper month-box" id="monthDropdownWrapper">
          <label id="lblModule">Модуль:</label>
          <div class="dropdown-btn" id="monthDropdownBtn">
            <span id="selectedMonthText">Модуль 1</span>
            <span class="arrow">▼</span>
          </div>
          <div class="dropdown-menu" id="monthDropdownMenu"></div>
        </div>

        <div class="dropdown-wrapper lesson-box" id="lessonDropdownWrapper">
          <label id="lblLesson">Урок:</label>
          <div class="dropdown-btn" id="lessonDropdownBtn">
            <span id="selectedLessonText">Выберите урок...</span>
            <span class="arrow">▼</span>
          </div>
          <div class="dropdown-menu" id="lessonDropdownMenu"></div>
        </div>
      </div>

      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="liveSearchInput" placeholder="Поиск урока по теме..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-btn" style="display:none;">✕</button>
      </div>
      <div id="searchResults" class="search-dropdown" style="display: none;"></div>
    </header>

    <section class="player-section">
      <div class="video-container">
        <video id="videoPlayer" controls playsinline controlsList="nodownload" preload="metadata"></video>
      </div>
      <div class="media-parts-bar" id="videoBar">
        <button id="prevVideoBtn" class="pill-btn">◀</button>
        <span id="videoPartTitle" class="badge">Видео: 1/1</span>
        <button id="nextVideoBtn" class="pill-btn">▶</button>
      </div>
    </section>

    <div class="lesson-meta">
      <div id="lessonBadge" class="lesson-badge">Модуль 1 • Урок 1</div>
      <h1 id="lessonHeading">Загрузка...</h1>
    </div>

    <!-- Вкладки, которые будут скрываться при отсутствии контента -->
    <nav class="tabs-nav" id="tabsNav">
      <button class="tab-item active" id="tabHw" data-tab="hw">📝 Домашка</button>
      <button class="tab-item" id="tabPdf" data-tab="pdf">📄 Конспекты PDF</button>
      <button class="tab-item" id="tabZip" data-tab="zip">📦 Исходный код</button>
    </nav>

    <main class="tab-content-area">
      <div class="sub-parts-bar" id="subPartsBar" style="display: none;">
        <button id="prevSubPartBtn" class="pill-btn">◀</button>
        <span id="subPartTitle" class="badge">Файл 1/1</span>
        <button id="nextSubPartBtn" class="pill-btn">▶</button>
      </div>

      <div id="fileTitleHeader" class="file-name-label"></div>
      <div id="mainContentBox" class="content-box"></div>

      <div class="action-buttons-row">
        <button id="openDirectBtn" class="action-btn btn-secondary">👁 Открыть файл</button>
        <button id="sendActionBtn" class="action-btn btn-primary">💬 Отправить в чат</button>
      </div>
    </main>
  </div>

  <!-- Модальное окно встроенного PDF -->
  <div id="pdfModal" class="pdf-modal" style="display: none;">
    <div class="pdf-modal-header">
      <span id="pdfModalTitle" class="pdf-modal-title">Конспект PDF</span>
      <div class="pdf-controls">
        <button id="pdfPrevPage" class="pill-btn">◀</button>
        <span id="pdfPageNum" class="badge">1 / 1</span>
        <button id="pdfNextPage" class="pill-btn">▶</button>
        <button id="closePdfModal" class="pill-btn close-btn">✕</button>
      </div>
    </div>
    <div class="pdf-modal-body" id="pdfCanvasContainer">
      <div id="pdfLoading" class="pdf-loading">Загрузка документа...</div>
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <script src="app.js?v=41"></script>
</body>
</html>
