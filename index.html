<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Образовательная платформа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div class="app-container">
    <!-- Блок выбора месяца и урока -->
    <header class="controls-header">
      <div class="selector-row">
        <div class="select-col month-col">
          <label for="monthPicker">Модуль:</label>
          <select id="monthPicker" class="custom-select"></select>
        </div>
        <div class="select-col lesson-col">
          <label for="lessonPicker">Урок:</label>
          <select id="lessonPicker" class="custom-select"></select>
        </div>
      </div>

      <!-- Поисковая строка живого поиска -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="liveSearchInput" placeholder="Поиск урока по теме или ключевому слову..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-btn" style="display:none;">✕</button>
      </div>
      <div id="searchResults" class="search-dropdown" style="display: none;"></div>
    </header>

    <!-- Плеер видео -->
    <section class="player-section">
      <div class="video-container">
        <video id="videoPlayer" controls playsinline preload="auto"></video>
      </div>
      <div class="video-parts-bar">
        <button id="prevPartBtn" class="pill-btn">◀ Часть</button>
        <span id="partTitle" class="badge">Часть 1/1</span>
        <button id="nextPartBtn" class="pill-btn">Часть ▶</button>
      </div>
    </section>

    <!-- Заголовок урока -->
    <div class="lesson-meta">
      <div id="lessonBadge" class="lesson-badge">Модуль 1</div>
      <h1 id="lessonHeading">Загрузка уроков...</h1>
    </div>

    <!-- Вкладки материалов -->
    <nav class="tabs-nav">
      <button class="tab-item active" data-tab="hw">📝 Домашка</button>
      <button class="tab-item" data-tab="pdf">📄 Конспект PDF</button>
      <button class="tab-item" data-tab="zip">📦 Исходный код</button>
    </nav>

    <!-- Контент активной вкладки -->
    <main class="tab-content-area">
      <div id="hwContent" class="content-box">Выберите урок для просмотра</div>
      <button id="sendActionBtn" class="action-btn">💬 Отправить в чат</button>
    </main>
  </div>

  <script src="app.js?v=10"></script>
</body>
</html>
